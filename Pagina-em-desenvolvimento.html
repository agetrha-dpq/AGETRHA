<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Documentos - Em desenvolvimento</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background: #0f1a24;
        color: #e6e9f0;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 40px 20px;
        text-align: center;
    }

    .construction-icon {
        font-size: 80px;
        color: #c9a959;
        margin-bottom: 20px;
        animation: pulse 2s infinite;
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.1); }
        100% { transform: scale(1); }
    }

    h1 {
        color: #c9a959;
        margin-bottom: 20px;
        font-size: 2.5rem;
    }

    p {
        color: #b0b8c5;
        font-size: 1.2rem;
        margin-bottom: 30px;
        line-height: 1.6;
    }

    .btn-voltar {
        display: inline-block;
        padding: 12px 30px;
        background: #c9a959;
        color: #0a1a2b;
        border-radius: 50px;
        font-weight: 600;
        font-size: 1.1rem;
        text-decoration: none;
        transition: all 0.3s ease;
        border: 2px solid #c9a959;
    }

    .btn-voltar:hover {
        background: transparent;
        color: #c9a959;
    }

    .btn-voltar i {
        margin-right: 8px;
    }

    /* Mantém a responsividade */
    @media (max-width: 480px) {
        h1 { font-size: 2rem; }
        p { font-size: 1rem; }
    }
</style>
</head>
<body>
<div class="container">
    <div class="construction-icon">
        <i class="fa-solid fa-hard-hat"></i>
        <i class="fa-solid fa-tools" style="margin-left: 10px;"></i>
    </div>
    <h1>Página em desenvolvimento</h1>
    <p>Estamos trabalhando para trazer novidades incríveis para você.<br>Em breve esta seção estará repleta de documentos e projetos.</p>
    <a href="https://agetrha-dpq.github.io/AGETRHA/documentos" class="btn-voltar">
        <i class="fas fa-arrow-left"></i> Voltar para a página de documentos
    </a>
</div>
</body>
</html>
